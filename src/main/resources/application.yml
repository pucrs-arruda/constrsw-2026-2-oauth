server:
  port: ${OAUTH_INTERNAL_API_PORT:8080}

spring:
  application:
    name: oauth
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.base-url}/realms/${keycloak.realm}

keycloak:
  base-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:constrsw}
  client-id: ${KEYCLOAK_CLIENT_ID:oauth}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  # Actuator (health + prometheus) roda numa porta propria no container
  # (OAUTH_INTERNAL_METRICS_PORT = 9464). Sem a variavel (mvn/testes locais),
  # fica na mesma porta da API.
  server:
    port: ${OAUTH_INTERNAL_METRICS_PORT:${server.port}}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  tracing:
    # Desligado por padrao: sem um collector OTLP no ar, o exporter loga ERROR a cada envio.
    enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    # Buckets de histograma para calcular p50/p95/p99 de latencia no Prometheus
    # (histogram_quantile sobre http_server_requests_seconds_bucket).
    distribution:
      percentiles-histogram:
        http.server.requests: true
    export:
      prometheus:
        enabled: true

logging:
  level:
    br.pucrs.constrsw.oauth: DEBUG
