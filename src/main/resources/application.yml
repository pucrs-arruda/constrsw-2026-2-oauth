server:
  port: ${OAUTH_INTERNAL_API_PORT:8081}

keycloak:
  base-url: ${KEYCLOAK_SERVER_URL:${KEYCLOAK_BASE_URL:http://keycloak:8080}}
  realm: ${KEYCLOAK_REALM:constrsw}
  client-id: ${KEYCLOAK_CLIENT_ID:oauth}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}

spring:
  application:
    name: oauth
  security:
    oauth2:
      resourceserver:
        jwt:
          # validação local via JWKS - o Spring busca as chaves públicas
          # automaticamente em {issuer-uri}/protocol/openid-connect/certs
          issuer-uri: ${keycloak.base-url}/realms/${keycloak.realm}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  server:
    port: ${OAUTH_INTERNAL_METRICS_PORT:9464}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:oauth}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      # Buckets fixos para o Apdex do Grafana (T = 250ms, tolerável até 1s)
      slo:
        http.server.requests: 100ms,250ms,1s
  tracing:
    sampling:
      probability: 1.0
