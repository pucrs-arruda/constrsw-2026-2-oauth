openapi: 3.1.0
info:
  title: Gateway de identidade ConstrSW
  version: 0.1.0
paths:
  /login:
    post:
      summary: Inicia uma sessão institucional
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201': {description: Sessão criada}
        '400': {description: Entrada inválida}
        '401': {description: Credencial recusada}
        '503': {description: Keycloak indisponível}
  /users:
    get:
      summary: Recupera todos os usuários
      tags: [users]
      security: [{bearerAuth: []}]
      parameters:
        - name: enabled
          in: query
          required: false
          schema: {type: boolean}
      responses:
        '200': {description: Usuários cadastrados, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/User'}}}}}
        '400': {description: Requisição inválida}
        '401': {description: Access token inválido}
        '403': {description: Permissão insuficiente}
  /users/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: Recupera um usuário
      tags: [users]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Usuário, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {description: Access token inválido}
        '403': {description: Permissão insuficiente}
        '404': {description: Usuário não localizado}
  /roles:
    post:
      summary: Cria um role
      tags: [roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRoleRequest'}
      responses:
        '201': {description: Role criado, content: {application/json: {schema: {$ref: '#/components/schemas/Role'}}}}
        '400': {description: Entrada inválida}
        '409': {description: Role já existe}
    get:
      summary: Lista todos os roles (exclui os excluídos logicamente)
      tags: [roles]
      responses:
        '200':
          description: Lista de roles
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Role'}}
  /roles/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Recupera um role pelo id
      tags: [roles]
      responses:
        '200': {description: Role, content: {application/json: {schema: {$ref: '#/components/schemas/Role'}}}}
        '404': {description: Role não encontrado}
    put:
      summary: Atualiza um role (substituição total)
      tags: [roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRoleRequest'}
      responses:
        '200': {description: Role atualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Role'}}}}
        '400': {description: Entrada inválida}
        '404': {description: Role não encontrado}
    patch:
      summary: Atualiza um role (parcial)
      tags: [roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRoleRequest'}
      responses:
        '200': {description: Role atualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Role'}}}}
        '404': {description: Role não encontrado}
    delete:
      summary: Exclui logicamente um role
      tags: [roles]
      responses:
        '204': {description: Role excluído logicamente}
        '404': {description: Role não encontrado}
  /roles/{id}/users/{userId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Atribui um role a um usuário
      tags: [roles]
      responses:
        '204': {description: Role atribuído ao usuário}
        '404': {description: Role não encontrado}
    delete:
      summary: Remove a atribuição de um role a um usuário
      tags: [roles]
      responses:
        '204': {description: Atribuição removida}
        '404': {description: Role não encontrado}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, format: email}
        password: {type: string, minLength: 1, writeOnly: true}
    Role:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
    UpdateRoleRequest:
      type: object
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
    User:
      type: object
      required: [id, username, first-name, last-name, enabled]
      properties:
        id: {type: string}
        username: {type: string, format: email}
        first-name: {type: string}
        last-name: {type: string}
        enabled: {type: boolean}
