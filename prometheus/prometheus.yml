global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: oauth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["oauth:9464"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
