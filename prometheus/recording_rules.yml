groups:
  - name: oauth_recording_rules
    interval: 15s
    rules:
      # Taxa de requisicoes/s, ja agregada por job - evita recalcular
      # rate() em cada consulta ad-hoc (economia de CPU do Prometheus
      # e consultas mais rapidas no Grafana).
      - record: oauth:http_requests:rate5m
        expr: sum by (job) (rate(http_server_requests_seconds_count[5m]))

      - record: oauth:http_errors:rate5m
        expr: sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))

      # Proporcao de erro 5xx sobre o total - a mesma serie que alimenta
      # o alerta HighErrorRate e o painel "Taxa de erro %" do Grafana.
      - record: oauth:http_error_ratio:rate5m
        expr: |
          oauth:http_errors:rate5m
          /
          oauth:http_requests:rate5m

      - record: oauth:latency_p95:5m
        expr: histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job="oauth"}[5m])))

      - record: oauth:latency_p99:5m
        expr: histogram_quantile(0.99, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job="oauth"}[5m])))

      # Metrica de negocio: proporcao de tentativas de login que falham.
      # Usada pelo alerta HighLoginFailureRatio (possivel forca bruta).
      - record: oauth:login_failure_ratio:rate5m
        expr: |
          sum(rate(oauth_login_attempts_total{result="failure"}[5m]))
          /
          sum(rate(oauth_login_attempts_total[5m]))
