groups:
  - name: service-http
    interval: 15s
    rules:
      - record: service:http_requests:rate5m
        expr: sum by (job, method, uri, status) (rate(http_server_requests_seconds_count{job=~"oauth|keycloak"}[5m]))

      - record: service:http_errors:rate5m
        expr: sum by (job) (rate(http_server_requests_seconds_count{job=~"oauth|keycloak",status=~"5.."}[5m])) or on (job) 0 * sum by (job) (rate(http_server_requests_seconds_count{job=~"oauth|keycloak"}[5m]))

      - record: service:http_request_duration:avg5m
        expr: sum by (job) (rate(http_server_requests_seconds_sum{job=~"oauth|keycloak"}[5m])) / sum by (job) (rate(http_server_requests_seconds_count{job=~"oauth|keycloak"}[5m]))

      - record: oauth:http_request_duration:p95_5m
        expr: histogram_quantile(0.95, sum by (le, method, uri) (rate(http_server_requests_seconds_bucket{job="oauth"}[5m])))

      - record: oauth:http_request_duration:p99_5m
        expr: histogram_quantile(0.99, sum by (le, method, uri) (rate(http_server_requests_seconds_bucket{job="oauth"}[5m])))
