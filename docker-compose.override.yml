# Override LOCAL, opcional, pra rodar o compose oficial do professor em Mac
# com Apple Silicon (M-series recentes) sem os problemas de ambiente
# relatados a ele (ver backend/oauth/infra-local/README.md): SIGILL da JVM
# do Keycloak, o healthcheck que depende de curl (que nao existe na imagem)
# e o prometheus.yml do professor ainda apontando pro hostname antigo
# "auth" em vez de "oauth" (job "auth" e job "health-checks").
#
# Nao muda nada do docker-compose.yml oficial na raiz do repo - so
# adiciona/sobrescreve o necessario nos serviços "keycloak" e "prometheus".
# Fica dentro de backend/oauth porque e o unico lugar onde o grupo03 tem
# permissao de commit; os arquivos oficiais do professor (docker-compose.yml,
# Dockerfile do keycloak, infrastructure/.../prometheus.yml) continuam
# intocados.
#
# Uso (a partir da raiz do repo base):
#   docker compose -f docker-compose.yml -f backend/oauth/docker-compose.override.yml up -d --build
services:
  keycloak:
    build:
      # mesmo build context oficial (tem o constrsw.json); so o Dockerfile
      # muda, pra um que mora aqui dentro do oauth.
      dockerfile: ../../../../backend/oauth/infra-local/keycloak.Dockerfile
    environment:
      # Bug conhecido do OpenJDK 21 em macOS 15.2+ com Apple Silicon recente
      # (M4): a JVM da SIGILL logo no bootstrap (System.registerNatives) por
      # causa de deteccao de SVE (Scalable Vector Extensions). Ver
      # https://github.com/keycloak/keycloak/issues/36008 e JDK-8345296.
      - JAVA_TOOL_OPTIONS=-XX:UseSVE=0
    healthcheck:
      # A imagem do Keycloak nao tem curl (nem dnf/microdnf pra instalar),
      # entao o healthcheck oficial (com curl) nao roda. Este aqui so
      # confirma que a porta de metrics esta aceitando conexao TCP, via
      # /dev/tcp (recurso builtin do bash, que ja existe na imagem porque o
      # kc.sh e um script bash).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/${KEYCLOAK_INTERNAL_METRICS_PORT}"]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 20

  prometheus:
    # O prometheus.yml oficial (infrastructure/dev.local/services/prometheus/
    # prometheus.yml, commit e201543 do professor) aponta o job "auth" e uma
    # entrada do job "health-checks" pro hostname "auth", mas o serviço no
    # docker-compose.yml se chama "oauth" - sem essa troca o Prometheus nunca
    # consegue resolver o DNS e o job fica "down" pra sempre. Corrigido numa
    # cópia local, sem mexer no arquivo do professor em infrastructure/.
    volumes:
      - constrsw-prometheus-data:/prometheus
      - ./backend/oauth/infra-local/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/dev.local/services/prometheus/alerts.yml:/etc/prometheus/alerts.yml
