name: Group 02 OAuth CI

on:
  push:
    branches: [grupo02]
  pull_request:
    branches: [grupo02]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit tests (services)
        run: mvn --batch-mode --no-transfer-progress -Dtest='*ServiceTest' test

      - name: Integration tests (Keycloak adapters)
        run: mvn --batch-mode --no-transfer-progress -Dtest='*ClientTest' test

      - name: Endpoint tests (Spring MVC)
        run: mvn --batch-mode --no-transfer-progress -Dtest='*ControllerTest' test

      - name: End-to-end tests (HTTP server)
        run: mvn --batch-mode --no-transfer-progress -Dtest='OAuthApiE2ETest,OAuthApplicationTests' test

      - name: Package application
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
